apiVersion: apps/v1
kind: Deployment
metadata:
  name: embers-of-destiny
  labels:
    app: embers-of-destiny
spec:
  replicas: 3
  selector:
    matchLabels:
      app: embers-of-destiny
  template:
    metadata:
      labels:
        app: embers-of-destiny
    spec:
      containers:
        - name: website
          image: embers-of-destiny:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: embers-of-destiny-service
spec:
  type: NodePort
  selector:
    app: embers-of-destiny
  ports:
    - name: http
      port: 80
      targetPort: 3000
      nodePort: 30080
